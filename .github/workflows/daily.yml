name: Daily File Update

on:
  schedule:
    - cron: '0 9 * * *' # Her gün 09:00'da çalışır (UTC saatiyle)
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git commit/push yapabilmesi için gerekli izin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so rebase works cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt || true

      - name: Run Python script
        run: python script.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/
          git commit -m "Günlük dosya güncellemesi: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase origin main
          git push
